[vendor]
simple_model = "ollama"
complex_model = "ollama"
embeddings_model = "ollama"

[aws]
simple_model = "anthropic.claude-3-haiku-20240307-v1:0"
complex_model = "anthropic.claude-3-5-sonnet-20240620-v1:0"
embeddings_model = "amazon.titan-embed-text-v1"
region_name = "us-east-1"

[openai]
simple_model = "gpt-4o-mini"
complex_model = "gpt-4o"
embeddings_model = "text-embedding-ada-002"
base_url = "https://api.openai.com/v1/" # for openai compatible apis

[ollama]
simple_model = "gemma3"
complex_model = "qwen2.5:14b"
embeddings_model = "llama3.2"
base_url = "http://via-ip-robo-srv-004.robotec.tm.pl:11434"

[tracing]
project = "rai"

[tracing.langfuse]
use_langfuse = false
host = "http://localhost:3000"

[tracing.langsmith]
use_langsmith = true
host = "https://api.smith.langchain.com"

[asr]
recording_device_name = "default"
vendor = "whisper"
language = "en"
silence_grace_period = 0.3
use_wake_word = false
vad_threshold = 0.3
wake_word_model = ""
wake_word_threshold = 0.5

[tts]
vendor = "elevenlabs"
keep_speaker_busy = false
